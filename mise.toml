# Toolchain versions only. Commands live in the justfile.
#
# No language runtime: this repository holds Hyprland's Lua configuration and
# Quickshell's QML. Neither is compiled here -- they are interpreted by the
# compositor and the shell runtime that ScorchedBlue ships.
#
# qmlformat and qmllint are deliberately absent. They come from Qt's devel
# packages, which the image does not carry, so QML checking runs in a container
# against the same Qt the image ships rather than against whatever is on PATH.
#
# shellcheck and shfmt are pinned to the same versions as scorchedblue, so the
# one shell script here is held to the same standard as the ones there.
# The conda backend is marked experimental in mise, and luajit is the only tool
# here that needs it. Enabling the setting in this file rather than in the
# workflow keeps a fresh clone and a runner behaving the same way.
[settings]
experimental = true

[tools]
# The backend is pinned deliberately. Bare `luajit` resolves to conda on a
# machine that has it and falls through to the asdf plugin otherwise -- and that
# plugin clones LuaJIT's git and looks for a tag `v2.1.1744318430`, which does
# not exist. Same version string, two backends, one of them broken.
"conda:luajit" = "2.1.1744318430"
gitleaks = "8.30.1"
just = "1.57.0"
stylua = "2.3"
shellcheck = "0.11.0"
shfmt = "3.14.0"
