# SonarQube Cloud project identity. Both keys are required for Cloud; the
# project was created under the scorchedblue organisation and its key cannot be
# changed without creating a different project.
sonar.projectKey=scorchedblue_scorched-desktop
sonar.organization=scorchedblue

# The whole tree. Most of it -- the QML and the Lua -- is in languages Sonar
# does not support, and it skips those without help; narrowing sonar.sources
# would only risk hiding the shell helpers that it can read.
sonar.sources=.
